[package]
name = "mock"
version = "0.1.0"
description = "Named mock states for views, rendered headlessly for review and regression tests."
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
assets.workspace = true
gpui.workspace = true
image.workspace = true
theme.workspace = true

# Rendering without a window. The browser build lists mocks but can't render them.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }

[target.'cfg(target_os = "windows")'.dependencies]
gpui_wgpu = { workspace = true, features = ["test-support"] }
