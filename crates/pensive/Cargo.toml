[package]
name = "pensive"
version = "0.1.0"
description = "A review-first Git client."
readme = "../../README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
assets.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
model = { workspace = true, features = ["fixtures"] }
settings.workspace = true
theme.workspace = true
ui.workspace = true

# The browser has no `git` command or config folder.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
config.workspace = true
git.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
log.workspace = true

[dev-dependencies]
components = { workspace = true, features = ["mocks"] }
mock.workspace = true
ui = { workspace = true, features = ["mocks"] }

[[test]]
name = "render_mocks"
harness = false
