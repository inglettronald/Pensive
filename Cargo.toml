[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/inglettronald/Pensive"

[workspace.dependencies]
gpui = "=0.2.2"
# TODO: reassess on the gpui 0.2.3 bump. gpui 0.2.2 depends on xattr 0.2.3
# (via gpui_http_client -> zed-async-tar), which uses libc::ENOATTR.
# libc 0.2.190 removed that constant, so newer versions fail to compile.
libc = "=0.2.189"
