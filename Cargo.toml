[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/inglettronald/Pensive"

[workspace.dependencies]
components = { path = "crates/components" }
mock = { path = "crates/mock" }
model = { path = "crates/model" }
theme = { path = "crates/theme" }
ui = { path = "crates/ui" }

# GPUI is not published to crates.io past 0.2.2, so we pin a Zed release tag.
gpui = { git = "https://github.com/zed-industries/zed", tag = "v1.27.0" }
# Zed's workspace leaves out gpui_linux's display servers, and without them
# Linux starts headless with no window. This is the feature set Zed itself uses.
gpui_platform = { git = "https://github.com/zed-industries/zed", tag = "v1.27.0", features = [
    "font-kit",
    "wayland",
    "x11",
] }
