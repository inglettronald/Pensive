<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tokens</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tokens.css">
</head>
<body>
<x-dc>
<helmet>
__FONTS_LINK__
<style>
body{margin:0;background:#101010}
</style>
</helmet>
<div style="width: 1280px; height: 1200px; box-sizing: border-box; padding: 56px; display: flex; flex-direction: column; gap: 40px; background: #101010; color: #d0d0d0; font-family: var(--font_ui), system-ui, sans-serif; font-size: 13px">

<header style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 24px; font-weight: 600; color: #f0f0f0">Tokens</h1>
<p style="margin: 0; color: #8a8a8a; font-family: var(--font_code), monospace; font-size: 12px">{{source}}</p>
</header>

<div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 48px; min-height: 0">

<section style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #8a8a8a">Color roles</h2>
<div style="display: flex; flex-direction: column; border: 1px solid #2a2a2a; border-radius: 8px; overflow: hidden">
<sc-for list="{{colors}}" as="g" hint-placeholder-count="6">
<div style="padding: 10px 14px 6px; background: #161616; font-size: 11px; font-weight: 500; color: #a0a0a0; border-top: 1px solid #2a2a2a">{{g.group}}</div>
<sc-for list="{{g.roles}}" as="r" hint-placeholder-count="4">
<div style="display: grid; grid-template-columns: 20px 170px 72px minmax(0, 1fr); align-items: center; gap: 12px; padding: 0 14px; height: 28px; border-top: 1px solid #1c1c1c">
<div style="{{r.chip}}"></div>
<span style="font-family: var(--font_code), monospace; font-size: 12px; color: #f0f0f0">{{r.name}}</span>
<span style="font-family: var(--font_code), monospace; font-size: 11px; color: #8a8a8a">{{r.value}}</span>
<span style="font-size: 12px; color: #a0a0a0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.note}}</span>
</div>
</sc-for>
</sc-for>
</div>
</section>

<div style="display: flex; flex-direction: column; gap: 32px; min-width: 0">

<section style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #8a8a8a">Fonts</h2>
<sc-for list="{{fonts}}" as="f" hint-placeholder-count="2">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 14px; border: 1px solid #2a2a2a; border-radius: 8px; background: #161616">
<span style="{{f.sample}}">{{f.family}}</span>
<span style="font-family: var(--font_code), monospace; font-size: 11px; color: #8a8a8a">--font_{{f.name}}</span>
</div>
</sc-for>
</section>

<section style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #8a8a8a">Density presets</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{presets}}" as="p" hint-placeholder-count="2">
<div data-density="{{p.attr}}" style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border: 1px solid #2a2a2a; border-radius: 8px; background: #161616; min-width: 0">
<div style="font-size: 12px; font-weight: 500; color: #f0f0f0">{{p.name}}</div>
<sc-for list="{{p.text}}" as="t" hint-placeholder-count="6">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px">
<span class="typeset-{{t.name}}" style="{{t.family}}">{{t.name}}</span>
<span style="font-family: var(--font_code), monospace; font-size: 11px; color: #8a8a8a; white-space: nowrap">{{t.spec}}</span>
</div>
</sc-for>
<div style="display: flex; flex-direction: column; gap: 4px; padding-top: 8px; border-top: 1px solid #2a2a2a">
<sc-for list="{{p.sizes}}" as="s" hint-placeholder-count="6">
<div style="display: flex; justify-content: space-between; font-family: var(--font_code), monospace; font-size: 11px">
<span style="color: #d0d0d0">{{s.name}}</span>
<span style="color: #8a8a8a">{{s.value}}px</span>
</div>
</sc-for>
</div>
</div>
</sc-for>
</div>
</section>

</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1200}}'>
class Component extends DCLogic {
  renderVals() {
    // {
    //   source: "theme crate at <short commit>",
    //   colors: [{ group, roles: [{ name, value: "#rrggbb", note }] }],
    //   fonts: [{ name, family }],
    //   presets: [{ name, text: [{ name, font, size, lineHeight, weight }], sizes: [{ name, value }] }]
    // }
    // Groups and roles keep the crate's order. A text role's `font` names its entry in `fonts`.
    const theme = __THEME__;

    const colors = theme.colors.map((g) => ({
      group: g.group,
      roles: g.roles.map((r) => ({
        ...r,
        chip: 'width: 20px; height: 20px; border-radius: 4px; background: ' + r.value + '; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12)'
      }))
    }));
    const fonts = theme.fonts.map((f) => ({
      ...f,
      sample: 'font-family: var(--font_' + f.name + '); font-size: 18px; color: #f0f0f0'
    }));
    const presets = theme.presets.map((p) => ({
      ...p,
      attr: p.name.toLowerCase(),
      text: p.text.map((t) => ({
        ...t,
        family: 'font-family: var(--font_' + t.font + '); color: #f0f0f0',
        spec: t.size + ' / ' + t.lineHeight + ' · ' + t.weight
      }))
    }));

    return { source: theme.source, colors, fonts, presets };
  }
}
</script>
</body>
</html>
