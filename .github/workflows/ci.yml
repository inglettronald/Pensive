name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Pushes to master build every platform. Pull requests build the `always`
  # platforms, plus any opted in with a `ci:<name>` or `ci:all` label.
  PLATFORMS: |
    [
      {"name": "linux", "os": "ubuntu-24.04", "always": true},
      {"name": "macos", "os": "macos-15"},
      {"name": "windows", "os": "windows-2025"}
    ]

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - run: cargo fmt --check

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p pensive --target wasm32-unknown-unknown

  platforms:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          matrix=$(jq -cn \
            --argjson platforms "$PLATFORMS" \
            --argjson labels "$LABELS" \
            --arg event "$GITHUB_EVENT_NAME" '
            [($labels // [])[] | select(startswith("ci:")) | ltrimstr("ci:")] as $requested
            | {include: [$platforms[] | . as $p
                | select($event == "push" or .always
                    or any($requested[]; . == "all" or . == $p.name))]}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: platforms
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - if: runner.os == 'Linux'
        run: script/bootstrap
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Every feature, so code behind `demo` and `mocks` is checked too.
      - run: cargo clippy --all-targets --all-features
      - run: cargo build
      - if: runner.os != 'Windows'
        run: cargo test
      - if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: mocks-linux
          path: target/mocks
          if-no-files-found: ignore
          retention-days: 14
      # GitHub's Windows runner has no Vulkan driver, so mocks can't render there yet (PEN-24).
      # This also skips any other integration test on Windows.
      - if: runner.os == 'Windows'
        run: cargo test --lib --bins
