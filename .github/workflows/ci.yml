name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - run: cargo fmt --check

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p pensive --target wasm32-unknown-unknown

  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-24.04 }
          - { name: macos, os: macos-15 }
          - { name: windows, os: windows-2025 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - if: runner.os == 'Linux'
        run: script/bootstrap
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Every feature, so code behind `demo` and `mocks` is checked too.
      - run: cargo clippy --all-targets --all-features
      - run: cargo build
      - if: runner.os != 'Windows'
        run: cargo test
      - if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: mocks-linux
          path: target/mocks
          if-no-files-found: ignore
          retention-days: 14
      # GitHub's Windows runner has no Vulkan driver, so mocks can't render there yet (PEN-24).
      # This also skips any other integration test on Windows.
      - if: runner.os == 'Windows'
        run: cargo test --lib --bins
